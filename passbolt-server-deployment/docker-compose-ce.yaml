# Passbolt CE - E-Mail nur ueber YAML (Postfix-Relay), GUI-Einstellungen ignoriert
# Voraussetzung: .env + certs/cert.pem + certs/key.pem (chmod 644)

services:
  smtp:
    image: freinet/postfix-relay:1.5
    restart: unless-stopped
    environment:
      MAILNAME: passbolt.<DOMAIN-FQDN>
      RELAYHOST: mail.<MAIL-RELAY-DOMAIN>:25
      RELAYHOST_AUTH: "no"
      USE_TLS: "no"
      MYNETWORKS: 127.0.0.0/8, 10.0.0.0/8, <IP-ADDRESS>/12, <IP-ADDRESS>/16

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE: "passbolt"
      MYSQL_USER: "passbolt"
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - database_volume:/var/lib/mysql

  passbolt:
    image: passbolt/passbolt:latest-ce-non-root
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - smtp
    environment:
      PASSBOLT_PLUGINS_SMTP_SETTINGS_ENABLED: "false"
      APP_FULL_BASE_URL: ${APP_URL}
      EMAIL_TRANSPORT_DEFAULT_HOST: smtp
      EMAIL_TRANSPORT_DEFAULT_PORT: "25"
      DATASOURCES_DEFAULT_HOST: "db"
      DATASOURCES_DEFAULT_USERNAME: "passbolt"
      DATASOURCES_DEFAULT_PASSWORD: ${DB_PASSWORD}
      DATASOURCES_DEFAULT_DATABASE: "passbolt"
      EMAIL_DEFAULT_FROM: ${EMAIL_FROM}
      EMAIL_DEFAULT_FROM_NAME: "Passbolt"
      PASSBOLT_PLUGINS_SMTP_SETTINGS_SECURITY_SSL_ALLOW_SELF_SIGNED: "true"
      PASSBOLT_SSL_SERVER_CERT_FILE: /etc/ssl/certs/certificate.crt
      PASSBOLT_SSL_SERVER_KEY_FILE: /etc/ssl/certs/certificate.key
    volumes:
      - gpg_volume:/etc/passbolt/gpg
      - jwt_volume:/etc/passbolt/jwt
      - ./certs/cert.pem:/etc/passbolt/certs/certificate.crt:ro
      - ./certs/key.pem:/etc/passbolt/certs/certificate.key:ro
    command:
      [
        "/usr/bin/wait-for.sh",
        "-t",
        "0",
        "db:3306",
        "--",
        "/docker-entrypoint.sh",
      ]
    ports:
      - 80:8080
      - 443:4433

volumes:
  database_volume:
  gpg_volume:
  jwt_volume:
